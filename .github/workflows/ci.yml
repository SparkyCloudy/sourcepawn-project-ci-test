name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Sourceknight
        uses: SparkyCloudy/sourceknight@v0.5.0

      - name: Build sourcemod plugins
        run: |
          sourceknight build --report json

      - name: Create package
        run: |
          set -euo pipefail
          mkdir -p /tmp/package/addons/sourcemod/plugins
          cp addons/sourcemod/plugins/*.smx /tmp/package/addons/sourcemod/plugins/
          if [ -d "addons/sourcemod/translations" ]; then
            mkdir -p /tmp/package/addons/sourcemod/translations
            cp -R addons/sourcemod/translations/* /tmp/package/addons/sourcemod/translations/
          fi
          if [ -d "addons/sourcemod/configs" ]; then
            mkdir -p /tmp/package/addons/sourcemod/configs
            cp -R addons/sourcemod/configs/* /tmp/package/addons/sourcemod/configs/
          fi
          if [ -d "sound" ]; then
            mkdir -p /tmp/package/sound
            cp -R sound/* /tmp/package/sound/
          fi

      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: /tmp/package

      - name: Upload Compile Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-report
          path: compile_report.json

  tag:
    name: Tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

      - uses: dev-drprasad/delete-tag-and-release@v1.1
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          delete_release: true
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: rickstaa/action-create-tag@v1
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag: "latest"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: [build, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts

      - name: Versioning
        run: |
          set -euo pipefail
          version="latest"
          if [[ "${{ github.ref_type }}" == 'tag' ]]; then
            version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`;
          fi
          echo "RELEASE_VERSION=$version" >> $GITHUB_ENV

      - name: Package
        run: |
          set -euo pipefail
          cd artifacts
          tar -czf ../${{ github.event.repository.name }}-${{ env.RELEASE_VERSION }}.tar.gz .
          cd ..

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.tar.gz'
          tag: ${{ env.RELEASE_VERSION }}
          file_glob: true
          overwrite: true
